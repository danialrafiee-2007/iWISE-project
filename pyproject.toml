[project]
name = "truth-guardian"
version = "0.1.0"
description = "Hallucination detection and reliability assessment for RAG and agentic AI answers (iWISE 2026, AI Challenge 4)."
readme = "README.md"
authors = [
    { name = "MrDanial-Rafiee", email = "mr.danialgithub@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.161.1",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyarrow==26.0.0",
    "pytest>=9.1.1",
]
media = [
    "av==19.0.2",
    "ctranslate2==4.8.4",
    "faster-whisper==1.2.1",
    "pillow==13.0.0",
    "tesserocr==2.12.0",
]
study = [
    "lettucedetect==0.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The media group (speech to text, text in images, audio decoding) is part of the local app and the
# launcher; the Docker image leaves it out (Dockerfile: --no-group media), as media there is a separate optional service.
default-groups = ["dev", "media"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
