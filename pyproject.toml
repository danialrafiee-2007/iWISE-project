[project]
name = "truth-guardian"
version = "0.1.0"
description = "Hallucination detection and reliability assessment for RAG and agentic AI answers (iWISE 2026, AI Challenge 4)."
readme = "README.md"
authors = [
    { name = "MrDanial-Rafiee", email = "mr.danialgithub@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
