<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene · Lumen Grid</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  /* UI PANEL — remove this block to drop the controls */
  #ui-panel { position: fixed; top: 12px; right: 12px; background: rgba(10,10,12,.75); color: #fff;
    font: 11px/1.4 -apple-system, system-ui, sans-serif; padding: 8px 10px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 240px; max-height: 80vh; overflow: auto; z-index: 1000; user-select: none; }
  #ui-toggle { background: none; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 0; }
  #ui-body { display: none; margin-top: 6px; }
  #ui-panel.-open #ui-body { display: block; }
  #ui-body label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0; }
  #ui-body input[type=color] { width: 28px; height: 20px; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; padding: 0; background: none; cursor: pointer; }
  #ui-body input[type=range] { width: 110px; }
  #ui-buttons { display: flex; gap: 6px; margin-top: 8px; }
  #ui-buttons button { flex: 1; cursor: pointer; background: rgba(255,255,255,.08); color: #fff;
    border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 5px 6px; font: 11px/1 sans-serif; }
  #ui-buttons button:hover { background: rgba(255,255,255,.16); }
  #ui-snapshot { margin: 8px 0 0; padding: 6px 8px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12); border-radius: 4px;
    font: 10px/1.45 ui-monospace, 'SF Mono', Menlo, monospace;
    white-space: pre-wrap; word-break: break-word; color: rgba(255,255,255,.88);
    max-height: 240px; overflow: auto; user-select: text; cursor: text; }
  /* END UI PANEL */
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three@0.143.0/build/three.module.js",
    "three/addons/": "/vendor/three@0.143.0/examples/jsm/"
  }
}
</script>
<style>#ui-panel{display:none!important}</style>
</head>
<body>
<canvas id="scene"></canvas>

<!-- UI PANEL — remove this block to drop the controls -->
<div id="ui-panel">
  <button id="ui-toggle" type="button" aria-label="Toggle controls">⚙ controls</button>
  <div id="ui-body"></div>
  <pre id="ui-snapshot" title="Click to select, then copy. These are the current CONFIG values."></pre>
</div>
<!-- END UI PANEL -->

<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'

/* ============================================================
   CONFIG  — every tweakable value lives here. Colors are '#rrggbb'
   strings; everything else is a number. The palette is a deep-teal
   "blueprint" set: a near-black void, an emerald depth field, two
   floating light pools (emerald + hot cyan) and a pale grid line.
   The UI panel + localStorage persistence are generated from these
   keys.
============================================================ */
const CONFIG = {
  colVoid:  '#05110e',    // deepest near-black (top / centre of the frame)
  colDeep:  '#123430',    // grey-emerald depth field (edges)
  colGlow:  '#166b58',    // main floating gradient pool
  colAccent:'#1f9c82',    // hotter cyan wisp + cursor light
  colGrid:  '#9ec9c0',    // pale grid-line colour
  zoom: 1.0,
  gridScale: 7.0,         // number of grid cells across
  gridThickness: 1.15,    // grid-line width (px-ish, larger = thicker)
  gridBright: 0.32,       // overall grid-line brightness
  ambient: 0.14,          // faint grid visible even in the dark
  litGrid: 0.85,          // how strongly the floating light lifts the grid
  angle: -7,              // grid rotation, degrees
  persp: 0.34,            // perspective convergence (lines densen toward top)
  curve: 0.16,            // gentle barrel curve — the "floating" bow
  gridDrift: 0.5,         // how far the whole grid slowly floats
  flowSpeed: 0.09,        // resting drift speed of the gradient pools
  speedBoost: 0.5,        // how much mouse energy accelerates the drift
  glowSize: 0.11,         // radius of each floating gradient pool
  glowStrength: 0.22,     // brightness of the pools
  pointerGlow: 0.32,      // brightness of the cursor light pool
  pointerSize: 0.09,      // radius of the cursor light pool
  bulgeAmt: 0.38,         // how strongly the grid bulges (lens magnify) under the cursor
  bulgeRad: 0.24,         // radius of the cursor bulge falloff
  brightness: 0.62,
  contrast: 1.1,
  vignette: 0.75,
  grain: 0.02,
  bloomStr: 0.22,
  bloomRadius: 0.65,
  bloomThresh: 0.55,
  mouseStrength: 1.0,     // how hard mouse motion injects energy
  settle: 0.95,           // how slowly it eases back to rest (higher = slower)
}

/* ---------- DEFAULTS + localStorage (load BEFORE building the scene) ---------- */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG))
const STORAGE_KEY = 'getlayers:lumen-grid'              // <- unique per scene
try { const s = JSON.parse(null || 'null'); if (s) for (const k in s) if (k in CONFIG) CONFIG[k] = s[k] } catch (e) {}
function saveConfig() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)) } catch (e) {} }

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255)
}

/* ---------- RENDERER / SCENE / CAMERA ---------- */
const canvas = document.getElementById('scene')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true, powerPreference: 'high-performance' })
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setClearColor(0x000000, 1)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10)
camera.position.set(0, 0, 1)   // unused by the clip-space quad, but RenderPass needs a camera

/* ============================================================
   SCENE: LUMEN GRID — a fullscreen fragment-shader scene. A pale
   perspective GRID (rotated, gently bowed by a barrel curve, and
   converging toward the top) floats over a dark emerald void, while
   a handful of soft GAUSSIAN LIGHT POOLS drift behind it — the
   "floating gradients" of the reference. Where a pool passes under
   the grid, it lifts the lines out of the dark (litGrid); away from
   the light the grid fades back to a faint blueprint. The whole grid
   also drifts slowly. Interaction: the pointer carries its own light
   pool, and MOVING the mouse injects "energy" that ACCELERATES the
   drift (via an accumulated flow phase) and swells the pools; when
   the mouse stops the energy eases away and the field slows to rest.
   Soft high-threshold bloom lifts the brightest cores. Reference: a
   dark teal perspective-grid wallpaper with floating gradient glows.
   Grid cousin of Chroma Lattice · gradient cousin of Liquid Aurora.
============================================================ */
const COL_KEYS = ['Void','Deep','Glow','Accent','Grid']
const gridUniforms = {
  uRes:        { value: new THREE.Vector2(1, 1) },
  uTime:       { value: 0 },
  uFade:       { value: 0 },
  uMouse:      { value: new THREE.Vector2(0, 0) },
  uEnergy:     { value: 0 },
  uPhase:      { value: 0 },
  uZoom:       { value: CONFIG.zoom },
  uGridScale:  { value: CONFIG.gridScale },
  uGridThick:  { value: CONFIG.gridThickness },
  uGridBright: { value: CONFIG.gridBright },
  uAmbient:    { value: CONFIG.ambient },
  uLitGrid:    { value: CONFIG.litGrid },
  uAngle:      { value: CONFIG.angle },
  uPersp:      { value: CONFIG.persp },
  uCurve:      { value: CONFIG.curve },
  uGridDrift:  { value: CONFIG.gridDrift },
  uGlowSize:   { value: CONFIG.glowSize },
  uGlowStr:    { value: CONFIG.glowStrength },
  uPtrGlow:    { value: CONFIG.pointerGlow },
  uPtrSize:    { value: CONFIG.pointerSize },
  uBulgeAmt:   { value: CONFIG.bulgeAmt },
  uBulgeRad:   { value: CONFIG.bulgeRad },
  uBright:     { value: CONFIG.brightness },
  uContrast:   { value: CONFIG.contrast },
  uVignette:   { value: CONFIG.vignette },
  uGrain:      { value: CONFIG.grain },
}
for (const k of COL_KEYS) gridUniforms['uc' + k] = { value: hexToVec3(CONFIG['col' + k]) }

const gridMat = new THREE.ShaderMaterial({
  uniforms: gridUniforms,
  depthTest: false, depthWrite: false,
  extensions: { derivatives: true },   // fwidth() for crisp, density-aware grid AA
  vertexShader: `
    void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform vec2  uRes, uMouse;
    uniform float uTime, uFade, uEnergy, uPhase, uZoom, uGridScale, uGridThick, uGridBright;
    uniform float uAmbient, uLitGrid, uAngle, uPersp, uCurve, uGridDrift, uGlowSize, uGlowStr;
    uniform float uPtrGlow, uPtrSize, uBulgeAmt, uBulgeRad, uBright, uContrast, uVignette, uGrain;
    uniform vec3  ucVoid, ucDeep, ucGlow, ucAccent, ucGrid;

    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }

    // a soft gaussian light pool centred at c with radius^2 s
    float pool(vec2 p, vec2 c, float s){ vec2 d = p - c; return exp(-dot(d, d) / s); }

    // crisp, density-aware grid: 1 on a line, 0 in the cell interior
    float gridLine(vec2 p, float thick){
      vec2 g = abs(fract(p - 0.5) - 0.5) / (fwidth(p) * thick);
      float line = min(g.x, g.y);
      return 1.0 - min(line, 1.0);
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes;
      vec2 P  = uv - 0.5;
      P.x *= uRes.x / uRes.y;          // aspect-correct centred coords

      float t = uPhase;                // accumulated flow phase (mouse energy speeds it up)

      /* ---- floating gradient pools (the "плавучие градиенты") ---- */
      vec2 c0 = vec2(-0.42 + 0.10 * sin(t * 0.60),        -0.30 + 0.08 * cos(t * 0.50));
      vec2 c1 = vec2( 0.40 + 0.14 * sin(t * 0.45 + 1.7),   0.28 + 0.10 * sin(t * 0.50 + 2.2));
      vec2 c2 = vec2(-0.05 + 0.18 * cos(t * 0.40 + 0.9),  -0.10 + 0.12 * sin(t * 0.55 + 3.0));
      vec2 c3 = vec2( 0.16 + 0.12 * sin(t * 0.50 + 2.6),   0.46 + 0.10 * cos(t * 0.42 + 1.2));
      float sz = uGlowSize * (1.0 + uEnergy * 0.5);

      float l0 = pool(P, c0, sz * 1.7);
      float l1 = pool(P, c1, sz * 1.1);
      float l2 = pool(P, c2, sz * 1.3);
      float l3 = pool(P, c3, sz * 0.9);

      // cursor light pool
      vec2 mp = vec2(uMouse.x * (uRes.x / uRes.y), uMouse.y) * 0.5;
      float lp = pool(P, mp, uPtrSize) * uPtrGlow * (0.6 + uEnergy);

      float L = (l0 + l1 + l2 + l3 + lp) * uGlowStr;                       // scalar light for the grid
      vec3 lightCol = (ucGlow * (l0 + l2 * 0.8) + ucAccent * (l1 * 0.9 + l3 * 0.7 + lp)) * uGlowStr;

      /* ---- base field: a dark void, warming to emerald at the lower-left
             & the edges (edge-lit, brightest bottom-left), like the ref ---- */
      float bl     = smoothstep(0.95, 0.10, length(P - vec2(-0.34, -0.42))); // bottom-left ground glow
      float bottom = smoothstep(0.20, -0.55, P.y);                          // lower half lifts
      float edge   = smoothstep(0.34, 0.70, length(P));                     // faint rim lift
      float bed    = clamp(bl * 0.55 + bottom * 0.22 + edge * 0.24, 0.0, 0.78);
      vec3 col = mix(ucVoid, ucDeep, bed);
      col += lightCol;

      /* ---- cursor BULGE: a soft convex lens that magnifies the grid cells under the
             pointer (pull sample coords toward the cursor → cells swell outward). Falls
             off with a gaussian, and swells a touch more when the mouse is moving. ---- */
      vec2 dmg = P - mp;
      float bulge = uBulgeAmt * (1.0 + uEnergy * 0.4) * exp(-dot(dmg, dmg) / (uBulgeRad * uBulgeRad));
      vec2 Pg = P - dmg * bulge;

      /* ---- the perspective grid ---- */
      float a = radians(uAngle);
      mat2 rot = mat2(cos(a), -sin(a), sin(a), cos(a));
      vec2 gc = rot * Pg;
      gc *= 1.0 + uCurve * dot(gc, gc);                                    // gentle barrel bow
      gc += uGridDrift * vec2(sin(t * 0.15) * 0.06, cos(t * 0.12) * 0.05); // whole grid floats
      float persp = 1.0 / (1.0 + uPersp * gc.y);                          // converge toward top
      vec2 wp = gc * uZoom * uGridScale * persp;

      float gm = gridLine(wp, uGridThick);
      float gridLit = uGridBright * (uAmbient + uLitGrid * L);
      col += ucGrid * gm * clamp(gridLit, 0.0, 2.0);

      /* ---- grade ---- */
      col = (col - 0.5) * uContrast + 0.5;
      col *= uBright;
      float vig = 1.0 - uVignette * dot(P, P) * 0.55;
      col *= vig;
      col += (hash(uv * uRes + uTime) - 0.5) * uGrain;                     // dither, kills banding
      col *= uFade;                                                        // 1–2s fade-in on load

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
})
const gridQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), gridMat)
gridQuad.frustumCulled = false
scene.add(gridQuad)

/* ---------- COMPOSER (grid → soft bloom → gamma) ---------- */
const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), CONFIG.bloomStr, CONFIG.bloomRadius, CONFIG.bloomThresh)
composer.addPass(bloomPass)
composer.addPass(new ShaderPass(GammaCorrectionShader))

/* ---------- INTERACTION (mouse motion accelerates + swells, then it settles) ---------- */
// Moving the mouse pumps `energyTarget` by how far/fast it moved; that energy
// speeds up the accumulated flow phase and swells the light pools. When the
// mouse stops, energyTarget decays (settle) and energy eases back to 0, so the
// drift slows to its resting speed and the pools relax.
const mouse = new THREE.Vector2(0, 0), mouseTarget = new THREE.Vector2(0, 0)
let energy = 0, energyTarget = 0
window.addEventListener('pointermove', e => {
  const nx = (e.clientX / window.innerWidth) * 2 - 1
  const ny = -((e.clientY / window.innerHeight) * 2 - 1)
  energyTarget = Math.min(1, energyTarget + Math.hypot(nx - mouseTarget.x, ny - mouseTarget.y) * 2.4 * CONFIG.mouseStrength)
  mouseTarget.set(nx, ny)
}, { passive: true })

/* ---------- CONFIG → uniforms ---------- */
function applyConfig() {
  for (const k of COL_KEYS) gridUniforms['uc' + k].value.copy(hexToVec3(CONFIG['col' + k]))
  gridUniforms.uZoom.value = CONFIG.zoom
  gridUniforms.uGridScale.value = CONFIG.gridScale
  gridUniforms.uGridThick.value = CONFIG.gridThickness
  gridUniforms.uGridBright.value = CONFIG.gridBright
  gridUniforms.uAmbient.value = CONFIG.ambient
  gridUniforms.uLitGrid.value = CONFIG.litGrid
  gridUniforms.uAngle.value = CONFIG.angle
  gridUniforms.uPersp.value = CONFIG.persp
  gridUniforms.uCurve.value = CONFIG.curve
  gridUniforms.uGridDrift.value = CONFIG.gridDrift
  gridUniforms.uGlowSize.value = CONFIG.glowSize
  gridUniforms.uGlowStr.value = CONFIG.glowStrength
  gridUniforms.uPtrGlow.value = CONFIG.pointerGlow
  gridUniforms.uPtrSize.value = CONFIG.pointerSize
  gridUniforms.uBulgeAmt.value = CONFIG.bulgeAmt
  gridUniforms.uBulgeRad.value = CONFIG.bulgeRad
  gridUniforms.uBright.value = CONFIG.brightness
  gridUniforms.uContrast.value = CONFIG.contrast
  gridUniforms.uVignette.value = CONFIG.vignette
  gridUniforms.uGrain.value = CONFIG.grain
  bloomPass.strength = CONFIG.bloomStr
  bloomPass.radius = CONFIG.bloomRadius
  bloomPass.threshold = CONFIG.bloomThresh
}

/* ---------- RESIZE ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight
  const dpr = Math.min(window.devicePixelRatio, 2)
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false)
  camera.aspect = w / h; camera.updateProjectionMatrix()
  composer.setPixelRatio(dpr); composer.setSize(w, h)
  gridUniforms.uRes.value.copy(renderer.getDrawingBufferSize(new THREE.Vector2()))
}
window.addEventListener('resize', resize)

/* ---------- RENDER LOOP ---------- */
let last = performance.now() / 1000
let flowPhase = 0
let fade = 0
function render() {
  requestAnimationFrame(render)
  if (window.__tgPaused) return
  const now = performance.now() / 1000
  const dt = Math.min(0.05, now - last); last = now

  // energy: pumped by mouse motion, eases back to rest at CONFIG.settle
  energyTarget *= CONFIG.settle
  energy += (energyTarget - energy) * 0.08
  mouse.lerp(mouseTarget, 0.05)

  // accumulate the flow phase so the drift smoothly speeds up while energised
  // and slows back to CONFIG.flowSpeed as energy fades — no jump on release.
  flowPhase += dt * (CONFIG.flowSpeed + energy * CONFIG.speedBoost)

  fade = Math.min(1, fade + dt / 1.2)                 // ~1.2s fade-in on load

  gridUniforms.uTime.value = now
  gridUniforms.uFade.value = fade
  gridUniforms.uPhase.value = flowPhase
  gridUniforms.uEnergy.value = energy
  gridUniforms.uMouse.value.copy(mouse)

  composer.render()
}

/* ===== UI (remove this block to drop the panel) ===== */
function setupColorUI(config, apply) {
  const panel = document.getElementById('ui-panel')
  const toggle = document.getElementById('ui-toggle')
  const body = document.getElementById('ui-body')
  if (!panel) return
  toggle.addEventListener('click', () => panel.classList.toggle('-open'))
  const _apply = apply
  apply = () => { _apply(); saveConfig(); renderSnapshot(config) }
  const numericRanges = {
    zoom:          { min: 0.5,  max: 3,    step: 0.02 },
    gridScale:     { min: 2,    max: 20,   step: 0.5 },
    gridThickness: { min: 0.5,  max: 4,    step: 0.05 },
    gridBright:    { min: 0,    max: 2,    step: 0.02 },
    ambient:       { min: 0,    max: 0.5,  step: 0.005 },
    litGrid:       { min: 0,    max: 4,    step: 0.05 },
    angle:         { min: -45,  max: 45,   step: 1 },
    persp:         { min: 0,    max: 1,    step: 0.01 },
    curve:         { min: -0.5, max: 0.8,  step: 0.01 },
    gridDrift:     { min: 0,    max: 2,    step: 0.02 },
    flowSpeed:     { min: 0,    max: 0.5,  step: 0.005 },
    speedBoost:    { min: 0,    max: 3,    step: 0.02 },
    glowSize:      { min: 0.03, max: 0.6,  step: 0.005 },
    glowStrength:  { min: 0,    max: 3,    step: 0.02 },
    pointerGlow:   { min: 0,    max: 3,    step: 0.02 },
    pointerSize:   { min: 0.02, max: 0.4,  step: 0.005 },
    bulgeAmt:      { min: 0,    max: 0.8,  step: 0.02 },
    bulgeRad:      { min: 0.05, max: 0.6,  step: 0.01 },
    brightness:    { min: 0,    max: 2,    step: 0.01 },
    contrast:      { min: 0.5,  max: 2,    step: 0.01 },
    vignette:      { min: 0,    max: 1.5,  step: 0.01 },
    grain:         { min: 0,    max: 0.1,  step: 0.002 },
    bloomStr:      { min: 0,    max: 2,    step: 0.02 },
    bloomRadius:   { min: 0,    max: 1.5,  step: 0.01 },
    bloomThresh:   { min: 0,    max: 1,    step: 0.01 },
    mouseStrength: { min: 0,    max: 3,    step: 0.02 },
    settle:        { min: 0.9,  max: 0.995, step: 0.001 },
  }
  for (const key of Object.keys(config)) {
    const v = config[key]
    const row = document.createElement('label')
    row.appendChild(Object.assign(document.createElement('span'), { textContent: key }))
    if (typeof v === 'string' && v[0] === '#') {
      const inp = document.createElement('input')
      inp.type = 'color'; inp.value = v
      inp.addEventListener('input', e => { config[key] = e.target.value; apply() })
      row.appendChild(inp)
    } else if (typeof v === 'number') {
      const r = numericRanges[key] || { min: 0, max: Math.max(1, v * 2), step: 0.01 }
      const inp = document.createElement('input')
      inp.type = 'range'; inp.min = String(r.min); inp.max = String(r.max); inp.step = String(r.step); inp.value = String(v)
      inp.addEventListener('input', e => {
        let val = parseFloat(e.target.value)
        if (Number.isInteger(r.step)) val = Math.round(val / r.step) * r.step
        config[key] = val
        apply()
      })
      row.appendChild(inp)
    }
    body.appendChild(row)
  }
  const btns = document.createElement('div'); btns.id = 'ui-buttons'
  const reloadBtn = document.createElement('button'); reloadBtn.type = 'button'; reloadBtn.textContent = '⟳ reload'
  const resetBtn  = document.createElement('button'); resetBtn.type = 'button'; resetBtn.textContent = '↺ reset'
  reloadBtn.title = 'Reload the page — re-initialise the scene with the saved settings'
  resetBtn.title = 'Clear saved settings and reload with defaults'
  reloadBtn.addEventListener('click', () => location.reload())
  resetBtn.addEventListener('click', () => { try { localStorage.removeItem(STORAGE_KEY) } catch (e) {} ; location.reload() })
  btns.appendChild(reloadBtn); btns.appendChild(resetBtn)
  body.appendChild(btns)
  panel.classList.add('-open')
  renderSnapshot(config)
}
function renderSnapshot(config) {
  const snap = document.getElementById('ui-snapshot')
  if (!snap) return
  const lines = ['const CONFIG = {']
  for (const key of Object.keys(config)) {
    const v = config[key]
    let formatted
    if (typeof v === 'string') formatted = "'" + v + "'"
    else if (Number.isInteger(v)) formatted = String(v)
    else formatted = String(parseFloat(v.toFixed(4)))
    lines.push('  ' + key + ': ' + formatted + ',')
  }
  lines.push('}')
  snap.textContent = lines.join('\n')
}

resize()
applyConfig()
setupColorUI(CONFIG, applyConfig)
render()
/* ===== END UI ===== */

/* ---- Truth Guardian bridge (added by web/scripts/vendor-layers.mjs) ---- */
window.__tgPaused = false
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || e.data.tg !== 1) return
  if ('paused' in e.data) window.__tgPaused = !!e.data.paused
  if (e.data.config) { Object.assign(CONFIG, e.data.config); applyConfig() }
  if (e.data.signal && typeof applyState === 'function') { CONFIG.autoCycle = 0; applyState(e.data.signal) }
})
parent.postMessage({ tg: 1, ready: true }, location.origin)
</script>
</body>
</html>
